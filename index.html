<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>haiiii klik aku yaa</title>
    
    <!-- CSS (Desain & Tampilan) -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
            color: #7f8c8d;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Halo, Selamat Datang!</h1>
    <p>Ini adalah website pertama saya.</p>
    
    <!-- Tombol dengan fungsi JavaScript -->
    <button onclick="sapaUser()">Klik Saya</button>

    <!-- JavaScript (Fungsi Interaktif) -->
    <script>
        function sapaUser() {
            alert('Halo! Terima kasih sudah mengunjungi website saya!');
        }
    </script>

</body>
</html>
